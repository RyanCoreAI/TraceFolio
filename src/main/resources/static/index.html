<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TraceFolio 控制台</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="brand">
        <span class="brand-mark">TF</span>
        <div>
          <strong>TraceFolio</strong>
          <span>个人技术资产证据库</span>
        </div>
      </div>

      <nav class="top-nav" aria-label="主导航">
        <a href="#overview" class="active">概览</a>
        <a href="#sources">资料</a>
        <a href="#qa">问答</a>
        <a href="#trace">回放</a>
      </nav>

      <div class="header-actions">
        <button class="button secondary" id="refreshStatusBtn" type="button">刷新状态</button>
        <a class="button ghost" href="/api/runtime/status" target="_blank" rel="noreferrer">状态 JSON</a>
      </div>
    </header>

    <main class="page">
      <section class="page-title" id="overview">
        <div>
          <p class="eyebrow">可信 RAG 工作台</p>
          <h1>用公开证据回答技术资产问题</h1>
        </div>
        <span class="metric" id="chunkMetric">0 个片段</span>
      </section>

      <section class="overview-panel">
        <div class="section-heading">
          <div>
            <p class="section-label">运行概览</p>
            <h2>服务状态</h2>
          </div>
        </div>
        <div class="status-strip" id="statusStrip" aria-live="polite"></div>
      </section>

      <section class="surface source-surface" id="sources">
        <div class="section-heading">
          <div>
            <p class="section-label">资料管理</p>
            <h2>导入公开证据</h2>
          </div>
        </div>

        <div class="source-layout">
          <form class="form source-form" id="githubForm">
            <div class="form-title">GitHub README / 文档</div>
            <div class="form-row three">
              <label>
                <span>组织或用户</span>
                <input name="owner" value="RyanCoreAI" autocomplete="off">
              </label>
              <label>
                <span>仓库名</span>
                <input name="repo" value="patchbrake" autocomplete="off">
              </label>
              <label>
                <span>文件路径</span>
                <input name="path" value="README.md" autocomplete="off">
              </label>
            </div>
            <button class="button primary" type="submit">导入 GitHub 资料</button>
          </form>

          <form class="form source-form" id="blogForm">
            <div class="form-title">公开博客文章</div>
            <label>
              <span>文章地址</span>
              <input name="url" value="https://spring.io/blog/2026/06/12/spring-ai-2-0-0-GA-available-now/" autocomplete="off">
            </label>
            <button class="button secondary" type="submit">导入博客文章</button>
          </form>
        </div>

        <div class="message" id="ingestMessage"></div>

        <div class="table-shell">
          <table>
            <thead>
              <tr>
                <th>类型</th>
                <th>标题</th>
                <th>片段数</th>
              </tr>
            </thead>
            <tbody id="documentsBody">
              <tr><td colspan="3" class="muted">暂无数据</td></tr>
            </tbody>
          </table>
        </div>
      </section>

      <section class="work-grid">
        <section class="surface qa-surface" id="qa">
          <div class="section-heading">
            <div>
              <p class="section-label">证据问答</p>
              <h2>提出问题</h2>
            </div>
            <span class="status-pill neutral" id="qaStatus">未提问</span>
          </div>

          <form id="qaForm" class="form ask-form">
            <label>
              <span>问题</span>
              <textarea name="question" rows="5">PatchBrake 是什么？</textarea>
            </label>
            <button class="button primary" type="submit">提交问题</button>
          </form>

          <article class="answer-block" id="answerBlock">
            <p class="muted">回答和引用会显示在这里。</p>
          </article>
        </section>

        <section class="surface trace-surface" id="trace">
          <div class="section-heading">
            <div>
              <p class="section-label">检索回放</p>
              <h2>Trace 与评测</h2>
            </div>
            <button class="button secondary" id="runEvalBtn" type="button">运行评测</button>
          </div>

          <form id="traceForm" class="trace-form">
            <input name="traceId" placeholder="输入 traceId">
            <button class="button ghost" type="submit">加载回放</button>
          </form>

          <div class="eval-summary" id="evalSummary"></div>
          <div class="trace-list" id="traceList">
            <p class="muted">检索证据、排名和 RRF 分数会显示在这里。</p>
          </div>
        </section>
      </section>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
